services:
  vehicle-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: vehicle-mcp-server:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - VEHICLE_MCP_TRANSPORT=http
      - VEHICLE_MCP_HTTP_HOST=0.0.0.0
      - VEHICLE_MCP_HTTP_PORT=8080
      - VEHICLE_MCP_ALLOW_INSECURE_BIND=true
      - VEHICLE_MCP_PIPELINE_BASE_URL=${PIPELINE_BASE_URL:-http://host.docker.internal:8000}
    restart: unless-stopped
