name: Public Demo Smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public MCP Server URL to smoke test"
        required: false
        default: "https://vehicle-mcp.chhlatbot.com/mcp"
      direct_origin_host:
        description: "Platform-generated hostname for the direct-origin probe (optional)"
        required: false
        default: ""
  workflow_call:
    inputs:
      target_url:
        description: "Public MCP Server URL to smoke test"
        required: true
        type: string
      direct_origin_host:
        description: "Platform-generated hostname for the direct-origin probe (optional)"
        required: false
        type: string
        default: ""
permissions:
  contents: read

jobs:
  smoke:
    name: Public MCP Smoke Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.26"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run public smoke verification
        env:
          PUBLIC_MCP_URL: ${{ inputs.target_url || 'https://vehicle-mcp.chhlatbot.com/mcp' }}
        run: |
          bash scripts/smoke-public.sh

      - name: Run public security probes
        env:
          PUBLIC_MCP_URL: ${{ inputs.target_url || 'https://vehicle-mcp.chhlatbot.com/mcp' }}
          PUBLIC_MCP_DIRECT_ORIGIN_HOST: ${{ inputs.direct_origin_host }}
        run: |
          bash scripts/smoke-public.sh --security
