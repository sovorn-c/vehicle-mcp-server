name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.5.26"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Check code formatting
        run: uv run ruff format --check .

      - name: Run mypy strict type check
        run: uv run mypy src

      - name: Run pytest test suite
        run: uv run pytest

      - name: Build Python package
        run: uv build

      - name: Build Docker container
        run: docker build -t vehicle-mcp-server:ci .

  cross-repo-smoke:
    runs-on: ubuntu-latest
    needs: [ci]

    steps:
      - name: Check out MCP server
        uses: actions/checkout@v4
        with:
          path: vehicle-mcp-server

      - name: Check out verified upstream pipeline
        uses: actions/checkout@v4
        with:
          repository: sovorn-c/nz-vehicle-data-pipeline
          ref: ea49e71075118d6cdc3ed2426cb3620f69792cf6
          path: nz-vehicle-data-pipeline

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.5.26"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run cross-repository smoke
        env:
          PIPELINE_DIR: nz-vehicle-data-pipeline
          PIPELINE_REF: ea49e71075118d6cdc3ed2426cb3620f69792cf6
        run: |
          cd vehicle-mcp-server
          PIPELINE_DIR="${GITHUB_WORKSPACE}/nz-vehicle-data-pipeline" PIPELINE_REF="ea49e71075118d6cdc3ed2426cb3620f69792cf6" bash scripts/smoke-local.sh
